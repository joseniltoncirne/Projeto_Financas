                <span style="font-size:10px;opacity:.5">▾</span>

                    <div style="padding:10px 14px;font-size:12px;color:var(--text3)" id="user-dropdown-info"></div>
                    <div class="user-dropdown-divider"></div>
                    <button class="user-dropdown-item" onclick="app.openBanksModal()">🏦 Bancos conectados</button>
                    <button class="user-dropdown-item" onclick="app.openDeletedHistoryModal()">🗑️ Histórico de excluídos</button>
                    <div class="user-dropdown-divider"></div>
                    <button class="user-dropdown-item danger" onclick="AuthService.logout();location.reload()">Sair
                        da conta</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Modal de detalhe do setor -->
    <div class="modal-overlay hidden" id="detail-overlay" onclick="if(event.target===this)app.closeDetail()">
        <div class="modal" style="max-width:480px">
            <div class="modal-header">
                <span class="modal-title" id="detail-title"></span>
                <button class="modal-close" onclick="app.closeDetail()">×</button>
            </div>
            <div class="detail-search-wrap" id="detail-search-wrap" style="display:none"><input class="detail-search" id="detail-search" type="text" placeholder="🔍 Pesquisar gasto..." oninput="app.filterCategoryDetail(this.value)"></div><div class="modal-body" id="detail-body"></div>
            <div class="modal-footer" style="justify-content:flex-end">
                <button class="add-btn" onclick="app.closeDetail()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de importação -->
    <div class="modal-overlay hidden" id="modal-overlay" onclick="if(event.target===this)app.closeModal()">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Importar extrato</span>
                <button class="modal-close" onclick="app.closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <span class="modal-footer-info" id="modal-footer-info"></span>
                <div style="display:flex;gap:8px">
                    <button class="add-btn" onclick="app.closeModal()">Cancelar</button>
                    <button class="save-btn" style="background:#C9A84C;color:#1C1C2E"
                        onclick="app.confirmImport()">Importar selecionados</button>
                </div>
            </div>
        </div>
    </div>

    <main class="main" id="app-main" style="display:none">
        <!-- Importar extrato + sync (todos os tamanhos) -->
        <div class="mobile-action-row">
            <button class="mobile-import-btn" onclick="document.getElementById('ofx-input').click()">↓ Importar extrato</button>
            <button id="sync-all-btn-mobile" class="mobile-sync-btn" onclick="app.syncAllBanks()" title="Sincronizar todos os bancos">↻ Sincronizar</button>
        </div>

        <!-- Bank nav -->
        <div id="bank-nav" class="bank-nav"></div>

        <!-- Overview geral -->
        <div id="sec-overview"></div>

        <!-- Minhas Contas (global — fora do bank-sections) -->
        <div id="sec-analise" style="display:none"></div>

        <!-- Bank sections (bancos específicos) -->
        <div id="bank-sections">
            <!-- Seletor de banco no modo geral -->
            <div id="detail-bank-picker"></div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="app.switchTab('resumo')">◈ Resumo</button>
                <button class="tab tab-entradas" onclick="app.switchTab('rendas')">↓ Entradas</button>
                <button class="tab tab-saidas" onclick="app.switchTab('gastos')">↑ Saídas</button>
                <button class="tab tab-cartao" id="tab-cartao" onclick="app.switchTab('cartao')" style="display:none">💳 Cartão</button>
            </div>

            <!-- Month nav -->
            <div class="month-nav">
                <button class="month-btn" onclick="app.shiftMonth(-1)">‹</button>
                <span class="month-label" id="month-label"></span>
                <button class="month-btn" onclick="app.shiftMonth(1)">›</button>
            </div>

            <!-- Sections -->
            <div id="sec-resumo" class="section active"></div>
            <div id="sec-rendas" class="section"></div>
            <div id="sec-gastos" class="section"></div>
            <div id="sec-cartao" class="section"></div>
        </div><!-- /bank-sections -->
    </main>

    <script src="./src/js/constants.js"></script>
    <script src="./src/js/services/ThemeManager.js"></script>
    <script src="./src/js/services/ApiClient.js"></script>
    <script src="./src/js/services/AuthService.js"></script>
    <script src="./src/js/ui/AuthUI.js"></script>
    <script src="./src/js/services/DataStore.js"></script>
    <script src="./src/js/services/BudgetNotifier.js"></script>
    <script src="./src/js/utils/BankDetector.js"></script>
    <script src="./src/js/utils/BankProfile.js"></script>
    <script src="./src/js/utils/Classifier.js"></script>
    <script src="./src/js/services/ImportService.js"></script>
    <script src="./src/js/ui/Renderer.js"></script>
    <script src="./src/js/app.js"></script>
    <script src="./src/js/ui/CategoryDetailUI.js"></script>
    <script src="./src/js/ui/CategoryManagerUI.js"></script>
    <script src="./src/js/ui/DeletedHistoryUI.js"></script>
    <script src="./src/js/ui/ImportUI.js"></script>
    <script src="./src/js/ui/BankConnectionUI.js"></script>
    <script src="./src/js/ui/ChecklistUI.js"></script>
    <script src="./src/main.js"></script>
    <script type="module">
        import { PluggyConnect } from 'pluggy-connect-sdk'
        window.PluggyConnect = PluggyConnect
    </script>
</body>

</html>
